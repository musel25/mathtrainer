[project]
name = "mathtrainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Musel25", email = "muselemmanuel@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.47.0",
]

[project.scripts]
mathtrainer = "mathtrainer.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
