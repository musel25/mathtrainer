# Production nginx vhost for mathtrainer.
# Installed on the server at /etc/nginx/sites-available/math.musel.dev
# and symlinked into /etc/nginx/sites-enabled/.

server {
    listen 80;
    listen [::]:80;
    server_name math.musel.dev;

    # ACME http-01 challenge for Let's Encrypt renewals — must stay open.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name math.musel.dev;

    ssl_certificate     /etc/letsencrypt/live/math.musel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.musel.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    # The app has no login of its own — basic auth is the gate.
    location / {
        auth_basic "mathtrainer";
        auth_basic_user_file /etc/nginx/.htpasswd-mathtrainer;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
